
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qrshield-x"
version = "0.1.0"
description = "Explainable Hybrid AI for Quishing Detection"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    {name = "QRShield-X Research Team"}
]
dependencies = [
    "pydantic==2.13.5",
    "scikit-learn>=1.9,<2.0",
    "PyYAML==6.0.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]